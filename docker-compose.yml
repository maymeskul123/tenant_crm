services:
  db:
    image: postgres:15-alpine
    container_name: tenant_crm_db
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: tenant_crm
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d tenant_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenant_network

  api:
    build: .
    container_name: tenant_crm_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://crm_user:crm_password@db:5432/tenant_crm
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - tenant_network

volumes:
  postgres_data:

networks:
  tenant_network:
    driver: bridge